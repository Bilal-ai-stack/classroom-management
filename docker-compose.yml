version: '3.8'

services:
  backend:
    build:
      context: ./codebase/backend
      dockerfile: Dockerfile
    container_name: classroom_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - classroom_db_data:/app/instance
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=classroom-management-secret-production-key
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./codebase/frontend
      dockerfile: Dockerfile
    container_name: classroom_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      - backend

volumes:
  classroom_db_data:
    driver: local
