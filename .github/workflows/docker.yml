name: Publish Docker Images

# Keep Docker Hub deployment pending until manually triggered by user
on:
  workflow_dispatch:
    inputs:
      dockerhub_username:
        description: 'Docker Hub Username (optional if secret is set)'
        required: false
        default: ''

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Docker Hub Credentials
        id: dockerhub-check
        run: |
          DH_USER="${{ secrets.DOCKERHUB_USERNAME }}"
          if [ -z "$DH_USER" ]; then
            DH_USER="${{ inputs.dockerhub_username }}"
          fi
          if [ -n "$DH_USER" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "has_dockerhub=true" >> $GITHUB_OUTPUT
            echo "username=$DH_USER" >> $GITHUB_OUTPUT
          else
            echo "has_dockerhub=false" >> $GITHUB_OUTPUT
            echo "username=" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Docker Hub
        if: steps.dockerhub-check.outputs.has_dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ steps.dockerhub-check.outputs.username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------
      # 1. Backend Image Build & Push
      # ----------------------------------------------------
      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}-backend
            ${{ steps.dockerhub-check.outputs.has_dockerhub == 'true' && format('{0}/classroom-backend', steps.dockerhub-check.outputs.username) || '' }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable=true

      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./codebase/backend
          file: ./codebase/backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----------------------------------------------------
      # 2. Frontend Image Build & Push
      # ----------------------------------------------------
      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}-frontend
            ${{ steps.dockerhub-check.outputs.has_dockerhub == 'true' && format('{0}/classroom-frontend', steps.dockerhub-check.outputs.username) || '' }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable=true

      - name: Build and push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./codebase/frontend
          file: ./codebase/frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish Summary
        if: always()
        run: |
          echo "### 🐳 Docker Images Build & Push Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub Container Registry (GHCR)**: ✅ Published" >> $GITHUB_STEP_SUMMARY
          echo "  - \`ghcr.io/${{ github.repository }}-backend:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "  - \`ghcr.io/${{ github.repository }}-frontend:latest\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.dockerhub-check.outputs.has_dockerhub }}" = "true" ]; then
            echo "- **Docker Hub**: ✅ Published to user \`${{ steps.dockerhub-check.outputs.username }}\`" >> $GITHUB_STEP_SUMMARY
            echo "  - \`${{ steps.dockerhub-check.outputs.username }}/classroom-backend:latest\`" >> $GITHUB_STEP_SUMMARY
            echo "  - \`${{ steps.dockerhub-check.outputs.username }}/classroom-frontend:latest\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Docker Hub**: ℹ️ Add \`DOCKERHUB_USERNAME\` and \`DOCKERHUB_TOKEN\` in GitHub repo Secrets to sync to Docker Hub" >> $GITHUB_STEP_SUMMARY
          fi
