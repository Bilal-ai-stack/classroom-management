name: Classroom Management CI/CD

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI (Flask & Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codebase/backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: codebase/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run Pytest Test Suite
        run: |
          pytest tests -v --tb=short

      - name: Log Test Execution Summary
        if: always()
        run: |
          echo "### 🧪 Backend Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Python**: 3.11" >> $GITHUB_STEP_SUMMARY
          echo "- **Framework**: Flask & SQLAlchemy" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ All tests executed" >> $GITHUB_STEP_SUMMARY

  frontend-ci:
    name: Frontend CI (Lint & Vite Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codebase/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: codebase/frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci || npm install

      - name: Run Linter (oxlint)
        run: |
          npm run lint

      - name: Build Production Web App
        run: |
          npm run build

      - name: Upload Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-production-dist
          path: codebase/frontend/dist
          retention-days: 14

      - name: Log Build Execution Summary
        if: always()
        run: |
          echo "### ⚡ Frontend Build Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Node**: 20" >> $GITHUB_STEP_SUMMARY
          echo "- **Framework**: React 19 + Vite 8" >> $GITHUB_STEP_SUMMARY
          echo "- **Bundle Size**: Ready for deployment" >> $GITHUB_STEP_SUMMARY

  deploy-cd:
    name: Continuous Deployment (GitHub Pages)
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Built Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-production-dist
          path: codebase/frontend/dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: codebase/frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Log Deployment Summary
        run: |
          echo "### 🚀 Continuous Deployment Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "- **Live URL**: [${{ steps.deployment.outputs.page_url }}](${{ steps.deployment.outputs.page_url }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: GitHub Pages" >> $GITHUB_STEP_SUMMARY
